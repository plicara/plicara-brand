name: Build and audit

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: make setup
      - name: Audit tokens
        run: make check
      - name: Rebuild and fail if any committed file changes
        run: |
          make build
          # Every glyph, the social card's included, is drawn as outlines,
          # so nothing depends on the machine's fonts. Everything must match.
          git diff --exit-code
          test -z "$(git status --porcelain)" || { git status --short; exit 1; }
